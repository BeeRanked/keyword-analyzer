# One-way mirror to gitlab.com/beeranked. GitHub is canonical; the GitLab copy
# is read-only (issues and MRs disabled there), so force-push is safe.
name: Mirror to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force "https://oauth2:${{ secrets.GITLAB_MIRROR_TOKEN }}@gitlab.com/beeranked/${{ github.event.repository.name }}.git" HEAD:main --tags
